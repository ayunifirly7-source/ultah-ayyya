<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Selamat Ulang Tahun Firly Ayuni</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            color: #fff;
        }
        .container {
            padding: 50px;
        }
        h1 {
            font-size: 3em;
        }
        p {
            font-size: 1.5em;
        }
        .card {
            background: rgba(255,255,255,0.2);
            padding: 30px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 20px;
        }
        .heart {
            font-size: 50px;
            animation: beat 1s infinite;
        }
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎉 Selamat Ulang Tahun 🎉</h1>
    <div class="card">
        <h2>Firly Ayuni 💖</h2>
        <p>Selamat ulang tahun yang ke-23!</p>
        <p>Semoga panjang umur, sehat selalu,</p>
        <p>dan tetap menjadi pribadi yang cantik, baik, dan membahagiakan 💕</p>
        <p>Semoga semua impianmu tercapai ✨</p>
        <div class="heart">❤️</div>
    </div>
</div>

</body>
</html>
